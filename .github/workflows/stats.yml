name: generate stats cards

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: generate stats images
        uses: jstrieb/github-stats@master
        with:
          username: shambhavidas76-art
          github_token: ${{ secrets.GITHUB_TOKEN }}
          exclude_repos: ""
          exclude_langs: ""
