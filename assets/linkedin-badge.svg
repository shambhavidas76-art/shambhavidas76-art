<svg width="320" height="80" viewBox="0 0 320 80" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="lgrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff2e9a"/>
      <stop offset="100%" stop-color="#7928ca"/>
    </linearGradient>
  </defs>
  <rect x="4" y="4" width="312" height="72" rx="18" fill="#1a0b2e" stroke="url(#lgrad)" stroke-width="3">
    <animate attributeName="stroke-width" values="3;6;3" dur="1.8s" repeatCount="indefinite"/>
  </rect>
  <rect x="4" y="4" width="312" height="72" rx="18" fill="none" stroke="#ff6ec7" stroke-width="1" opacity="0.6">
    <animate attributeName="opacity" values="0.6;0;0.6" dur="1.8s" repeatCount="indefinite"/>
  </rect>
  <g transform="translate(38,40)">
    <circle r="20" fill="url(#lgrad)"/>
    <text x="0" y="8" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="#ffffff">in</text>
  </g>
  <text x="80" y="48" font-family="Trebuchet MS, sans-serif" font-size="28" font-weight="800" fill="#ffffff">LinkedIn</text>
</svg>
