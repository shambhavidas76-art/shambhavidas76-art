<svg width="480" height="380" viewBox="0 0 480 380" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a0b2e"/>
      <stop offset="100%" stop-color="#2d0a3e"/>
    </linearGradient>
    <linearGradient id="screenGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2b0f4a"/>
      <stop offset="100%" stop-color="#160822"/>
    </linearGradient>
  </defs>

  <rect width="480" height="380" rx="20" fill="url(#bgGrad)"/>

  <!-- twinkling stars -->
  <g fill="#ff9ed8">
    <circle cx="40" cy="40" r="2"><animate attributeName="opacity" values="0;1;0" dur="2.2s" repeatCount="indefinite"/></circle>
    <circle cx="430" cy="60" r="2"><animate attributeName="opacity" values="0;1;0" dur="1.8s" begin="0.5s" repeatCount="indefinite"/></circle>
    <circle cx="60" cy="300" r="2" fill="#00e5ff"><animate attributeName="opacity" values="0;1;0" dur="2s" begin="0.8s" repeatCount="indefinite"/></circle>
    <circle cx="420" cy="310" r="2"><animate attributeName="opacity" values="0;1;0" dur="2.4s" begin="1.1s" repeatCount="indefinite"/></circle>
  </g>

  <!-- desk -->
  <rect x="40" y="300" width="400" height="16" rx="4" fill="#3a1655"/>

  <!-- laptop base -->
  <path d="M110,300 L370,300 L390,320 L90,320 Z" fill="#3a1655" stroke="#ff6ec7" stroke-width="1.5"/>

  <!-- laptop screen -->
  <g>
    <rect x="120" y="180" width="240" height="122" rx="8" fill="#1a0b2e" stroke="#ff6ec7" stroke-width="2"/>
    <rect x="130" y="190" width="220" height="102" rx="4" fill="url(#screenGrad)"/>

    <!-- typed code lines, looping reveal -->
    <g font-family="Fira Code, monospace" font-size="11" fill="#ff9ed8">
      <text x="140" y="208">
        <tspan>const girl = "coder";</tspan>
        <animate attributeName="opacity" values="0;1;1;1;1;0" dur="6s" repeatCount="indefinite"/>
      </text>
      <text x="140" y="224" fill="#00e5ff">
        <tspan>girl.headphones = true;</tspan>
        <animate attributeName="opacity" values="0;0;1;1;1;0" dur="6s" begin="0.6s" repeatCount="indefinite"/>
      </text>
      <text x="140" y="240" fill="#ff6ec7">
        <tspan>while (curious) {</tspan>
        <animate attributeName="opacity" values="0;0;0;1;1;0" dur="6s" begin="1.2s" repeatCount="indefinite"/>
      </text>
      <text x="150" y="256">
        <tspan>build();</tspan>
        <animate attributeName="opacity" values="0;0;0;0;1;0" dur="6s" begin="1.8s" repeatCount="indefinite"/>
      </text>
      <text x="140" y="272" fill="#ff6ec7">
        <tspan>}</tspan>
        <animate attributeName="opacity" values="0;0;0;0;1;0" dur="6s" begin="2.1s" repeatCount="indefinite"/>
      </text>
    </g>

    <!-- blinking cursor -->
    <rect x="152" y="262" width="7" height="12" fill="#00e5ff">
      <animate attributeName="opacity" values="1;0;1" dur="0.9s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- girl: hair back -->
  <path d="M240,120 C195,120 175,165 180,210 C182,235 195,255 205,265 L215,240 C205,220 202,190 215,165 C225,150 240,145 255,150 C270,145 285,150 295,165 C308,190 305,220 295,240 L305,265 C315,255 328,235 330,210 C335,165 315,120 270,120 Z" fill="#2a1245"/>

  <!-- girl: whole body group with subtle idle bob -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0,0; 0,-3; 0,0" dur="3.2s" repeatCount="indefinite"/>

    <!-- torso / hoodie -->
    <path d="M175,300 C175,255 200,235 255,235 C310,235 335,255 335,300 Z" fill="#ff2e9a"/>
    <path d="M175,300 C175,265 195,245 220,238 L235,300 Z" fill="#7928ca"/>
    <path d="M335,300 C335,265 315,245 290,238 L275,300 Z" fill="#7928ca"/>

    <!-- neck -->
    <rect x="240" y="195" width="30" height="30" rx="8" fill="#f2c6a0"/>

    <!-- head -->
    <ellipse cx="255" cy="170" rx="42" ry="46" fill="#f2c6a0"/>

    <!-- hair front / bangs -->
    <path d="M215,150 C215,120 235,105 255,105 C275,105 295,120 295,150 C295,155 292,158 288,155 C280,135 270,128 255,128 C240,128 230,135 222,155 C218,158 215,155 215,150 Z" fill="#2a1245"/>
    <path d="M213,160 C205,175 205,200 215,220 C218,205 218,185 222,168 Z" fill="#2a1245"/>
    <path d="M297,160 C305,175 305,200 295,220 C292,205 292,185 288,168 Z" fill="#2a1245"/>

    <!-- glasses -->
    <g stroke="#1a0b2e" stroke-width="3" fill="none">
      <circle cx="238" cy="172" r="15"/>
      <circle cx="272" cy="172" r="15"/>
      <line x1="253" y1="172" x2="257" y2="172"/>
    </g>
    <circle cx="238" cy="172" r="15" fill="#00e5ff" opacity="0.15"/>
    <circle cx="272" cy="172" r="15" fill="#00e5ff" opacity="0.15"/>

    <!-- headphones -->
    <path d="M205,160 C205,120 230,95 255,95 C280,95 305,120 305,160" fill="none" stroke="#1a0b2e" stroke-width="7" stroke-linecap="round"/>
    <rect x="192" y="150" width="20" height="34" rx="9" fill="#ff6ec7" stroke="#1a0b2e" stroke-width="2"/>
    <rect x="298" y="150" width="20" height="34" rx="9" fill="#ff6ec7" stroke="#1a0b2e" stroke-width="2"/>

    <!-- mouth -->
    <path d="M245,190 Q255,196 265,190" stroke="#c9754f" stroke-width="2.5" fill="none" stroke-linecap="round"/>

    <!-- arms -->
    <path d="M205,255 C195,270 190,290 195,305" stroke="#ff2e9a" stroke-width="20" stroke-linecap="round" fill="none"/>
    <path d="M305,255 C315,270 320,290 315,305" stroke="#ff2e9a" stroke-width="20" stroke-linecap="round" fill="none"/>

    <!-- hands, typing bob -->
    <g>
      <ellipse cx="215" cy="302" rx="10" ry="8" fill="#f2c6a0">
        <animateTransform attributeName="transform" type="translate" values="0,0; 0,-4; 0,0" dur="0.35s" repeatCount="indefinite"/>
      </ellipse>
      <ellipse cx="295" cy="302" rx="10" ry="8" fill="#f2c6a0">
        <animateTransform attributeName="transform" type="translate" values="0,-3; 0,1; 0,-3" dur="0.4s" begin="0.15s" repeatCount="indefinite"/>
      </ellipse>
    </g>
  </g>

  <!-- keyboard -->
  <rect x="180" y="303" width="150" height="14" rx="3" fill="#160822" stroke="#ff6ec7" stroke-width="1"/>
</svg>
