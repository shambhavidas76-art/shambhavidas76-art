<svg width="1200" height="300" viewBox="0 0 1200 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a0b2e"/>
      <stop offset="45%" stop-color="#2d0a3e"/>
      <stop offset="100%" stop-color="#4a0e4e"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#ff2e9a" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#ff2e9a" stop-opacity="0"/>
    </radialGradient>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1200" height="300" fill="url(#bg)"/>
  <rect width="1200" height="300" fill="url(#glow)"/>

  <!-- circuit lines -->
  <g stroke="#ff6ec7" stroke-width="1.5" opacity="0.35" fill="none">
    <path d="M0,60 H180 L210,90 H400"/>
    <path d="M0,240 H150 L180,210 H360 L390,240 H600"/>
    <path d="M1200,50 H1020 L990,80 H820"/>
    <path d="M1200,250 H1050 L1020,220 H860 L830,250 H700"/>
  </g>
  <g fill="#ff6ec7">
    <circle cx="180" cy="60" r="4"><animate attributeName="opacity" values="1;0.2;1" dur="2.4s" repeatCount="indefinite"/></circle>
    <circle cx="400" cy="90" r="4"><animate attributeName="opacity" values="0.2;1;0.2" dur="2.1s" repeatCount="indefinite"/></circle>
    <circle cx="600" cy="240" r="4"><animate attributeName="opacity" values="1;0.2;1" dur="1.8s" repeatCount="indefinite"/></circle>
    <circle cx="1020" cy="80" r="4"><animate attributeName="opacity" values="0.2;1;0.2" dur="2.6s" repeatCount="indefinite"/></circle>
    <circle cx="700" cy="250" r="4"><animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite"/></circle>
  </g>

  <!-- ghost code brackets -->
  <text x="60" y="180" font-family="Fira Code, monospace" font-size="90" fill="#ff2e9a" opacity="0.10" font-weight="bold">&lt;/&gt;</text>
  <text x="980" y="150" font-family="Fira Code, monospace" font-size="70" fill="#00e5ff" opacity="0.10" font-weight="bold">{ }</text>

  <!-- binary scatter -->
  <g font-family="Fira Code, monospace" font-size="14" fill="#ff9ed8" opacity="0.25">
    <text x="40" y="30">01001 11010</text>
    <text x="900" y="270">10110 01101</text>
    <text x="1000" y="35">0101 1001</text>
    <text x="30" y="270">1100 0110</text>
  </g>

  <!-- gear icon, top-left -->
  <g transform="translate(95,55)" fill="none" stroke="#ff6ec7" stroke-width="2.5" opacity="0.55">
    <circle r="22"/>
    <circle r="7" fill="#ff6ec7" stroke="none"/>
    <g id="teeth">
      <rect x="-3" y="-30" width="6" height="10"/>
      <rect x="-3" y="20" width="6" height="10"/>
      <rect x="-30" y="-3" width="10" height="6"/>
      <rect x="20" y="-3" width="10" height="6"/>
    </g>
    <animateTransform attributeName="transform" type="rotate" from="0 95 55" to="360 95 55" dur="12s" repeatCount="indefinite" additive="sum"/>
  </g>

  <!-- laptop icon, bottom-right -->
  <g transform="translate(1080,235)" fill="none" stroke="#00e5ff" stroke-width="2.5" opacity="0.55">
    <rect x="-35" y="-25" width="70" height="45" rx="3"/>
    <path d="M-45,20 H45 L35,30 H-35 Z" fill="#00e5ff" opacity="0.35" stroke="none"/>
  </g>

  <!-- main catchy text -->
  <text x="600" y="140" text-anchor="middle" font-family="Trebuchet MS, sans-serif" font-size="52" font-weight="800" fill="#ffffff" filter="url(#softGlow)">
    Hey World, I'm Shambhavi ⚡
  </text>
  <text x="600" y="180" text-anchor="middle" font-family="Trebuchet MS, sans-serif" font-size="20" font-weight="500" fill="#ff9ed8">
    Engineer in the making · Tech Explorer · Code &amp; Curiosity
  </text>
</svg>
