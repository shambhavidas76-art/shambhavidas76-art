<svg width="480" height="420" viewBox="0 0 480 420" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a0b2e"/>
      <stop offset="55%" stop-color="#2d0a3e"/>
      <stop offset="100%" stop-color="#3a0e4e"/>
    </linearGradient>
    <linearGradient id="screenGrad2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2b0f4a"/>
      <stop offset="100%" stop-color="#160822"/>
    </linearGradient>
    <radialGradient id="screenGlow" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#ff2e9a" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#ff2e9a" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="480" height="420" rx="20" fill="url(#bgGrad2)"/>

  <!-- drifting background blobs -->
  <circle cx="70" cy="90" r="55" fill="#ff2e9a" opacity="0.08">
    <animate attributeName="cy" values="90;70;90" dur="7s" repeatCount="indefinite"/>
  </circle>
  <circle cx="420" cy="340" r="65" fill="#00e5ff" opacity="0.08">
    <animate attributeName="cy" values="340;315;340" dur="8s" repeatCount="indefinite"/>
  </circle>

  <!-- twinkling stars -->
  <g fill="#ff9ed8">
    <circle cx="40" cy="40" r="2"><animate attributeName="opacity" values="0;1;0" dur="2.2s" repeatCount="indefinite"/></circle>
    <circle cx="440" cy="55" r="2"><animate attributeName="opacity" values="0;1;0" dur="1.8s" begin="0.5s" repeatCount="indefinite"/></circle>
    <circle cx="55" cy="360" r="2" fill="#00e5ff"><animate attributeName="opacity" values="0;1;0" dur="2s" begin="0.8s" repeatCount="indefinite"/></circle>
    <circle cx="430" cy="150" r="2"><animate attributeName="opacity" values="0;1;0" dur="2.4s" begin="1.1s" repeatCount="indefinite"/></circle>
    <circle cx="30" cy="200" r="1.8" fill="#00e5ff"><animate attributeName="opacity" values="0;1;0" dur="2.1s" begin="1.4s" repeatCount="indefinite"/></circle>
  </g>

  <!-- floating orbiting tech glyphs -->
  <g font-family="Fira Code, monospace" font-weight="bold">
    <text x="60" y="130" font-size="20" fill="#ff6ec7" opacity="0.6">
      &lt;/&gt;
      <animateTransform attributeName="transform" type="translate" values="0,0; 0,-14; 0,0" dur="4.5s" repeatCount="indefinite"/>
    </text>
    <text x="395" y="110" font-size="18" fill="#00e5ff" opacity="0.6">
      { }
      <animateTransform attributeName="transform" type="translate" values="0,0; 0,-10; 0,0" dur="3.8s" begin="0.6s" repeatCount="indefinite"/>
    </text>
    <text x="405" y="220" font-size="16" fill="#ff9ed8" opacity="0.55">
      ⚛
      <animateTransform attributeName="transform" type="rotate(0 405 220); rotate(360 405 220)" dur="9s" repeatCount="indefinite"/>
    </text>
    <text x="45" y="250" font-size="16" fill="#ff2e9a" opacity="0.6">
      ♥
      <animate attributeName="opacity" values="0.3;0.8;0.3" dur="2.4s" repeatCount="indefinite"/>
    </text>
  </g>

  <!-- desk -->
  <rect x="40" y="330" width="400" height="16" rx="4" fill="#3a1655"/>

  <!-- potted plant, leaf sways -->
  <g transform="translate(80,300)">
    <path d="M-10,30 L10,30 L7,45 L-7,45 Z" fill="#7928ca"/>
    <g>
      <animateTransform attributeName="transform" type="rotate" values="-4 0 30; 4 0 30; -4 0 30" dur="3.5s" repeatCount="indefinite"/>
      <path d="M0,30 C-4,10 -14,0 -20,-6" stroke="#2ecc71" stroke-width="3" fill="none" stroke-linecap="round"/>
      <path d="M0,30 C4,8 12,-2 18,-10" stroke="#2ecc71" stroke-width="3" fill="none" stroke-linecap="round"/>
      <path d="M0,30 C0,5 0,-8 0,-18" stroke="#2ecc71" stroke-width="3" fill="none" stroke-linecap="round"/>
    </g>
  </g>

  <!-- coffee mug with steam -->
  <g transform="translate(400,300)">
    <path d="M-12,20 L12,20 L10,36 C10,40 -10,40 -10,36 Z" fill="#ff6ec7"/>
    <path d="M12,24 C22,24 22,34 12,34" stroke="#ff6ec7" stroke-width="3" fill="none"/>
    <g stroke="#ff9ed8" stroke-width="2" fill="none" opacity="0.7" stroke-linecap="round">
      <path d="M-5,15 C-5,8 0,8 0,2">
        <animate attributeName="opacity" values="0;0.7;0" dur="2.2s" repeatCount="indefinite"/>
      </path>
      <path d="M5,15 C5,8 10,8 10,2">
        <animate attributeName="opacity" values="0;0.7;0" dur="2.2s" begin="1s" repeatCount="indefinite"/>
      </path>
    </g>
  </g>

  <!-- laptop base -->
  <path d="M110,330 L370,330 L390,350 L90,350 Z" fill="#3a1655" stroke="#ff6ec7" stroke-width="1.5"/>

  <!-- laptop screen with glow -->
  <g>
    <ellipse cx="240" cy="245" rx="140" ry="80" fill="url(#screenGlow)">
      <animate attributeName="opacity" values="0.5;1;0.5" dur="3s" repeatCount="indefinite"/>
    </ellipse>
    <rect x="120" y="210" width="240" height="122" rx="8" fill="#1a0b2e" stroke="#ff6ec7" stroke-width="2"/>
    <rect x="130" y="220" width="220" height="102" rx="4" fill="url(#screenGrad2)"/>

    <g font-family="Fira Code, monospace" font-size="11" fill="#ff9ed8">
      <text x="140" y="238">
        <tspan>const girl = "coder";</tspan>
        <animate attributeName="opacity" values="0;1;1;1;1;0" dur="6s" repeatCount="indefinite"/>
      </text>
      <text x="140" y="254" fill="#00e5ff">
        <tspan>girl.vibe = "unstoppable";</tspan>
        <animate attributeName="opacity" values="0;0;1;1;1;0" dur="6s" begin="0.6s" repeatCount="indefinite"/>
      </text>
      <text x="140" y="270" fill="#ff6ec7">
        <tspan>while (curious) {</tspan>
        <animate attributeName="opacity" values="0;0;0;1;1;0" dur="6s" begin="1.2s" repeatCount="indefinite"/>
      </text>
      <text x="150" y="286">
        <tspan>build();</tspan>
        <animate attributeName="opacity" values="0;0;0;0;1;0" dur="6s" begin="1.8s" repeatCount="indefinite"/>
      </text>
      <text x="140" y="302" fill="#ff6ec7">
        <tspan>}</tspan>
        <animate attributeName="opacity" values="0;0;0;0;1;0" dur="6s" begin="2.1s" repeatCount="indefinite"/>
      </text>
    </g>

    <rect x="152" y="292" width="7" height="12" fill="#00e5ff">
      <animate attributeName="opacity" values="1;0;1" dur="0.9s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- girl group -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0,0; 0,-4; 0,0" dur="3.2s" repeatCount="indefinite"/>

    <!-- hair back, sways -->
    <g>
      <animateTransform attributeName="transform" type="rotate" values="-1.5 255 150; 1.5 255 150; -1.5 255 150" dur="4s" repeatCount="indefinite"/>
      <path d="M240,150 C195,150 175,195 180,240 C182,265 195,285 205,295 L215,270 C205,250 202,220 215,195 C225,180 240,175 255,180 C270,175 285,180 295,195 C308,220 305,250 295,270 L305,295 C315,285 328,265 330,240 C335,195 315,150 270,150 Z" fill="#2a1245"/>
    </g>

    <!-- torso / hoodie -->
    <path d="M175,330 C175,285 200,265 255,265 C310,265 335,285 335,330 Z" fill="#ff2e9a"/>
    <path d="M175,330 C175,295 195,275 220,268 L235,330 Z" fill="#7928ca"/>
    <path d="M335,330 C335,295 315,275 290,268 L275,330 Z" fill="#7928ca"/>

    <rect x="240" y="225" width="30" height="30" rx="8" fill="#f2c6a0"/>

    <!-- head with gentle tilt -->
    <g>
      <animateTransform attributeName="transform" type="rotate" values="-2 255 200; 2 255 200; -2 255 200" dur="4s" repeatCount="indefinite"/>

      <ellipse cx="255" cy="200" rx="42" ry="46" fill="#f2c6a0"/>

      <path d="M215,180 C215,150 235,135 255,135 C275,135 295,150 295,180 C295,185 292,188 288,185 C280,165 270,158 255,158 C240,158 230,165 222,185 C218,188 215,185 215,180 Z" fill="#2a1245"/>
      <path d="M213,190 C205,205 205,230 215,250 C218,235 218,215 222,198 Z" fill="#2a1245"/>
      <path d="M297,190 C305,205 305,230 295,250 C292,235 292,215 288,198 Z" fill="#2a1245"/>

      <g stroke="#1a0b2e" stroke-width="3" fill="none">
        <circle cx="238" cy="202" r="15"/>
        <circle cx="272" cy="202" r="15"/>
        <line x1="253" y1="202" x2="257" y2="202"/>
      </g>
      <circle cx="238" cy="202" r="15" fill="#00e5ff" opacity="0.15"/>
      <circle cx="272" cy="202" r="15" fill="#00e5ff" opacity="0.15"/>

      <path d="M205,190 C205,150 230,125 255,125 C280,125 305,150 305,190" fill="none" stroke="#1a0b2e" stroke-width="7" stroke-linecap="round"/>
      <rect x="192" y="180" width="20" height="34" rx="9" fill="#ff6ec7" stroke="#1a0b2e" stroke-width="2"/>
      <rect x="298" y="180" width="20" height="34" rx="9" fill="#ff6ec7" stroke="#1a0b2e" stroke-width="2"/>
      <circle cx="202" cy="197" r="3" fill="#00e5ff">
        <animate attributeName="opacity" values="0.4;1;0.4" dur="1.4s" repeatCount="indefinite"/>
      </circle>

      <path d="M245,220 Q255,226 265,220" stroke="#c9754f" stroke-width="2.5" fill="none" stroke-linecap="round"/>

      <!-- blush -->
      <ellipse cx="225" cy="212" rx="7" ry="4" fill="#ff6ec7" opacity="0.35"/>
      <ellipse cx="285" cy="212" rx="7" ry="4" fill="#ff6ec7" opacity="0.35"/>
    </g>

    <path d="M205,285 C195,300 190,320 195,335" stroke="#ff2e9a" stroke-width="20" stroke-linecap="round" fill="none"/>
    <path d="M305,285 C315,300 320,320 315,335" stroke="#ff2e9a" stroke-width="20" stroke-linecap="round" fill="none"/>

    <g>
      <ellipse cx="215" cy="332" rx="10" ry="8" fill="#f2c6a0">
        <animateTransform attributeName="transform" type="translate" values="0,0; 0,-4; 0,0" dur="0.35s" repeatCount="indefinite"/>
      </ellipse>
      <ellipse cx="295" cy="332" rx="10" ry="8" fill="#f2c6a0">
        <animateTransform attributeName="transform" type="translate" values="0,-3; 0,1; 0,-3" dur="0.4s" begin="0.15s" repeatCount="indefinite"/>
      </ellipse>
    </g>
  </g>

  <rect x="180" y="333" width="150" height="14" rx="3" fill="#160822" stroke="#ff6ec7" stroke-width="1"/>

  <!-- sparkles near her head -->
  <g fill="#ffffff">
    <path d="M300,140 l2,6 6,2 -6,2 -2,6 -2,-6 -6,-2 6,-2 Z">
      <animate attributeName="opacity" values="0;1;0" dur="2.4s" begin="0.3s" repeatCount="indefinite"/>
    </path>
    <path d="M200,120 l1.5,4.5 4.5,1.5 -4.5,1.5 -1.5,4.5 -1.5,-4.5 -4.5,-1.5 4.5,-1.5 Z">
      <animate attributeName="opacity" values="0;1;0" dur="2.1s" begin="1s" repeatCount="indefinite"/>
    </path>
  </g>
</svg>
